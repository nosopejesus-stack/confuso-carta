<style>
@font-face{font-family:"Pf";src:url("fonts/PlayfairDisplay-regular.ttf") format("truetype");font-display:swap}

:root{--paper:#DAD3C7;--ink:#131110;--soft:#3D3832;--line:#8F877A;--night:#0b0a09}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--night);color:var(--paper);font-family:"Pf",Georgia,serif;overflow-x:hidden}
.cap{font-family:"Ms",Arial,sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
a{color:inherit;text-decoration:none}

/* entrada */
header.bar .mini{font-size:11px}
html.bloq,html.bloq body{overflow:hidden;height:100%}
#pre{position:fixed;inset:0;z-index:50;pointer-events:auto}
#pre .tl{position:absolute;top:0;bottom:0;width:50.5%;transition:transform 1.5s cubic-bezier(.7,0,.2,1);
  background:repeating-linear-gradient(90deg,#0e0a0a 0,#1c1312 22px,#120c0c 46px,#231716 70px,#0d0909 96px);box-shadow:inset 0 -120px 160px rgba(0,0,0,.6)}
#pre .tl.i{left:0}#pre .tl.d{right:0}
#pre.abre .tl.i{transform:translateX(-102%)}#pre.abre .tl.d{transform:translateX(102%)}
#pre .ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--paper);transition:opacity .6s ease}
#pre.abre .ct{opacity:0}
#pre .wm{font-size:clamp(36px,10vw,104px);letter-spacing:.34em;margin-right:-.34em;line-height:1;display:flex}
#pre .wm span{opacity:0;transform:translateY(18px);filter:blur(6px);transition:opacity .7s ease,transform .7s ease,filter .7s ease}
#pre.letras .wm span{opacity:1;transform:none;filter:none}
#pre svg{width:min(78vw,640px);height:22px;margin:22px 0 18px;overflow:visible}
#pre svg .hilo{fill:none;stroke:var(--paper);stroke-width:1.4;stroke-dasharray:9 7;opacity:.9}
#pre svg .m{fill:var(--paper)}
#pre .sub{font-style:italic;font-size:clamp(15px,2.2vw,20px);opacity:0;transition:opacity .8s ease}
#pre.letras .sub{opacity:.85}
#pre .salta{position:absolute;bottom:26px;font-size:10px;opacity:.55}

/* barra */
header.bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:18px 22px;mix-blend-mode:difference;color:#fff}
header.bar .logo{font-size:18px;letter-spacing:.32em}
header.bar button{font:inherit;background:none;border:1px solid #fff;color:#fff;padding:7px 12px;cursor:pointer;font-family:"Ms",Arial,sans-serif;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase}

/* portada */
.hero{position:relative;height:100svh;min-height:560px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:0 22px 9vh}
.hero video,.pase .fondo video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,9,.35),rgba(11,10,9,.15) 40%,rgba(11,10,9,.85))}
.hero h1{text-shadow:0 2px 24px rgba(0,0,0,.5);position:relative;font-weight:400;font-size:clamp(54px,15vw,210px);line-height:.9;letter-spacing:.12em}
.hero p{position:relative;margin-top:18px;font-size:clamp(17px,2.4vw,24px);font-style:italic}
.hero .baja{position:relative;margin-top:34px;font-size:11px;display:flex;align-items:center;gap:12px}
.hero .baja i{display:block;width:1px;height:42px;background:var(--paper);animation:baja 2.2s ease-in-out infinite;transform-origin:top}
@keyframes baja{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(0);transform-origin:bottom}}

/* índice */
.indice{background:var(--paper);color:var(--ink);padding:80px 22px 90px}
.indice .k{font-size:11px;color:var(--soft);margin-bottom:22px}
.indice a{display:flex;align-items:baseline;gap:18px;border-top:1px solid var(--line);padding:16px 0 14px;transition:padding-left .35s ease}
.indice a:last-child{border-bottom:1px solid var(--line)}
.indice a:hover{padding-left:14px}
.indice .num{font-size:11px;color:var(--soft);min-width:44px}
.indice .t{font-size:clamp(34px,7vw,92px);line-height:1}
.indice .ab{margin-left:auto;font-size:10px;color:var(--soft);text-align:right}

/* pases */
.pase{position:relative}
.pase .fondo{position:sticky;top:0;height:100svh;overflow:hidden;z-index:0;background:#000}
.pase .fondo::before{content:'';position:absolute;inset:-40px;background:var(--poster) center/cover no-repeat;filter:blur(28px) brightness(.55);transform:scale(1.1)}
@media (max-aspect-ratio:1/1){.pase .fondo video.h{inset:auto;left:0;top:50%;height:70svh;transform:translateY(-50%);object-fit:cover}}
.pase .fondo .velo{position:absolute;inset:0;background:rgba(11,10,9,.55)}
.pase .capa{position:relative;z-index:1;margin-top:-100svh}
.pase .cab{text-shadow:0 2px 18px rgba(0,0,0,.6);height:100svh;display:flex;flex-direction:column;justify-content:center;padding:0 22px}
.pase .cab .cap{font-size:12px}
.pase .cab h2{font-weight:400;font-style:italic;font-size:clamp(54px,13vw,180px);line-height:.95;margin-top:10px}
.pase .cab .ab{margin-top:16px;font-size:11px}
.ck{min-height:92svh;display:flex;align-items:center;justify-content:center;padding:6vh 16px}
.card{width:min(560px,100%);background:rgba(218,211,199,.93);color:var(--ink);padding:30px 26px 26px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
      opacity:0;transform:translateY(60px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.1,1)}
.card.ve{opacity:1;transform:none}
.card .no{font-size:11px;color:var(--soft)}
.card h3{font-weight:400;font-size:clamp(46px,9vw,72px);line-height:1;margin-top:6px}
.card .tx{font-size:19px;line-height:1.45;margin-top:16px}
.card .ing{font-size:11.5px;line-height:1.75;margin-top:16px}
.card .gar{font-size:17px;margin-top:12px}
.card .gar i{color:var(--soft)}
.card .al{font-size:16px;font-style:italic;color:var(--soft);margin-top:4px}

footer{background:var(--paper);color:var(--ink);padding:70px 22px 60px;text-align:center}
footer .wm{font-size:clamp(30px,7vw,64px);letter-spacing:.38em;margin-right:-.38em}
footer p{margin-top:20px;font-style:italic;font-size:16px;color:var(--soft)}
footer .cap{margin-top:18px;font-size:10px;color:var(--soft)}
@media (min-width:900px){.ck{justify-content:flex-end;padding-right:8vw}.ck:nth-child(even){justify-content:flex-start;padding-left:8vw}}
@media (prefers-reduced-motion:reduce){.card{opacity:1;transform:none;transition:none}.hero .baja i{animation:none}}
