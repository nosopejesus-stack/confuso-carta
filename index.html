<html lang="es">
<head>

<meta name="description" content="Confuso, Madrid. Carta de cócteles: catorce cócteles en cinco pases.">

<style>
@font-face{font-family:"Pf";src:url("fonts/PlayfairDisplay-regular.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Pf";font-style:italic;src:url("fonts/PlayfairDisplay-italic.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Ms";src:url("fonts/Montserrat-regular.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Ms";font-weight:700;src:url("fonts/Montserrat-bold.ttf") format("truetype");font-display:swap}
:root{--paper:#DAD3C7;--paper2:#cfc7b9;--ink:#131110;--soft:#3D3832;--night:#0b0a09;--m:22px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--night);color:var(--paper);font-family:"Pf",Georgia,serif;overflow-x:hidden;font-size:18px}
a{color:inherit;text-decoration:none}
.sans{font-family:"Ms",Arial,sans-serif}
html.bloq,html.bloq body{overflow:hidden;height:100%}

/* entrada: telón de terciopelo */
#pre{position:fixed;inset:0;z-index:50}
#pre .tl{position:absolute;top:0;bottom:0;width:50.5%;background:#2a0b0c url(img/telon.jpg) no-repeat;background-size:200% 100%;transition:transform 1.6s cubic-bezier(.7,0,.2,1)}
#pre .tl.i{left:0;background-position:left center}#pre .tl.d{right:0;background-position:right center}
#pre .tl::after{content:"";position:absolute;inset:0;background:rgba(8,4,4,.55)}
#pre.abre .tl.i{transform:translateX(-102%)}#pre.abre .tl.d{transform:translateX(102%)}
#pre .ct{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--paper);transition:opacity .6s ease;padding:0 var(--m)}
#pre.abre .ct{opacity:0}
#pre .wm{font-size:clamp(40px,11vw,112px);letter-spacing:.3em;margin-right:-.3em;line-height:1;display:flex}
#pre .wm span{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
#pre.letras .wm span{opacity:1;transform:none}
#pre svg{width:min(78vw,640px);height:22px;margin:24px 0 20px;overflow:visible}
#pre svg .hilo{fill:none;stroke:var(--paper);stroke-width:1.6;stroke-dasharray:10 7}
#pre svg .m{fill:var(--paper)}
#pre .sub{font-style:italic;font-size:20px;opacity:0;transition:opacity .8s ease}
#pre.letras .sub{opacity:1}
#pre .salta{position:absolute;bottom:28px;font-size:14px;opacity:.75}

/* barra */
header.bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:16px var(--m) 30px;color:var(--paper);
  background:linear-gradient(rgba(11,10,9,.7),rgba(11,10,9,0))}
header.bar .logo{font-size:18px;letter-spacing:.3em}

/* portada */
.hero{position:relative;height:100svh;min-height:600px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:0 var(--m) 10vh}
/* el vídeo se reproduce escondido y se dibuja en un canvas: así ningún navegador puede mostrar sus controles ni su botón flotante */
video,.hero video,.pase .fondo video{position:absolute;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none;z-index:0}
canvas.cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}
video{pointer-events:none}
video::-webkit-media-controls,video::-webkit-media-controls-panel,video::-webkit-media-controls-play-button,video::-webkit-media-controls-start-playback-button,video::-webkit-media-controls-overlay-play-button{display:none!important;-webkit-appearance:none;opacity:0}
.fill{position:absolute;inset:-60px;background:center/cover no-repeat;filter:blur(34px) brightness(.45);transform:translateZ(0)}
.hero .scrim{position:absolute;inset:0;background:linear-gradient(rgba(11,10,9,0) 25%,rgba(11,10,9,.78) 60%,rgba(11,10,9,.95))}
.hero h1{position:relative;font-weight:400;font-size:clamp(58px,15vw,200px);line-height:.92;letter-spacing:.1em}
.hero .que{position:relative;margin-top:14px;font-size:21px;line-height:1.4;max-width:30ch}
.hero .baja{position:relative;margin-top:30px;font-size:15px;display:flex;align-items:center;gap:12px}
.hero .baja i{display:block;width:1px;height:40px;background:var(--paper);animation:baja 2.2s ease-in-out infinite;transform-origin:top}
@keyframes baja{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(0);transform-origin:bottom}}

/* pases: vídeo nítido al abrir, difuminado al leer */
.pase{position:relative}
.pase .fondo{position:sticky;top:0;height:100svh;overflow:hidden;z-index:0;background:#000}
.pase .fondo .velo{position:absolute;inset:0;background:#0b0a09;opacity:.72;transition:opacity 1s ease}
.pase.abierto .fondo .velo{opacity:0}
.pase .fondo .scrim{position:absolute;inset:0;background:linear-gradient(rgba(11,10,9,0) 35%,rgba(11,10,9,.9))}
.pase .capa{position:relative;z-index:1;margin-top:-100svh}
.pase .cab{height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 var(--m) 12vh}
.pase .cab .pn{font-size:15px}
.pase .cab h2{font-weight:400;font-style:italic;font-size:clamp(60px,14vw,180px);line-height:.95;margin-top:8px}
.pase .cab .ab{margin-top:14px;font-size:15px}
.ck{min-height:78svh;display:flex;align-items:center;justify-content:center;padding:5vh var(--m)}
.card{width:min(640px,100%);background:var(--paper);color:var(--ink);padding:34px 28px 30px}
.card h3{font-weight:400;font-size:clamp(48px,9vw,76px);line-height:1}
.card .tx{font-size:20px;line-height:1.5;margin-top:16px}
.card .ing{font-size:15px;line-height:1.6;margin-top:18px;color:var(--soft)}
.card .gar{font-size:18px;margin-top:14px}
.card .al{font-size:18px;font-style:italic;color:var(--soft);margin-top:4px}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.1,1)}
.ve .rv{opacity:1;transform:none}
.ve .rv:nth-child(2){transition-delay:.08s}.ve .rv:nth-child(3){transition-delay:.16s}.ve .rv:nth-child(4){transition-delay:.24s}.ve .rv:nth-child(5){transition-delay:.32s}

footer{background:var(--paper);color:var(--ink);padding:110px var(--m) 70px}
footer .wm{font-size:clamp(54px,16vw,200px);letter-spacing:.1em;line-height:.9}
footer p{margin-top:22px;font-size:18px;max-width:40ch}
footer .ciudad{margin-top:30px;font-size:15px;color:var(--soft)}
@media (min-width:900px){:root{--m:48px}.ck{min-height:90svh}.card{padding:48px 46px 42px}.card .tx{font-size:22px}}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.pase .fondo .velo{transition:none}#pre{display:none}}
</style>
</head>
<body>
<div id="pre" aria-hidden="true"><div class="tl i"></div><div class="tl d"></div><div class="ct"><div class="wm" id="prewm"></div>
<svg viewBox="0 0 640 22" preserveAspectRatio="none"><defs><mask id="mk"><rect id="mr" x="0" y="0" width="0" height="22" fill="#fff"/></mask></defs>
<path class="hilo" mask="url(#mk)" d="M0 11 C 80 2, 160 20, 240 11 S 400 2, 480 11 S 600 20, 640 11"/><circle class="m" id="aguja" cx="0" cy="11" r="2.8"/></svg>
<div class="sub">Catorce cócteles en cinco pases</div><div class="sans salta">Toca para entrar</div></div></div>
<header class="bar"><span class="logo">CONFUSO</span></header>
<main id="top">
<section class="hero">
<div class="fill" style="background-image:url(video/portada.jpg)"></div><video id="hv" muted playsinline webkit-playsinline loop autoplay disablepictureinpicture disableremoteplayback preload="auto" poster="video/portada.jpg" src="video/portada.mp4" aria-hidden="true"></video>
<div class="scrim"></div>
<h1>CONFUSO</h1><p class="que">Carta de cócteles. Catorce cócteles en cinco pases, cada uno con el nombre de una tela.</p>
<div class="sans baja"><i></i>Desliza para ver la carta</div>
</section>
<div id="pases"></div>
</main>
<footer><div class="wm">CONFUSO</div><p>Si tiene alguna alergia o intolerancia alimentaria, consulte a nuestro equipo antes de pedir.</p><p class="sans ciudad">Madrid</p></footer>
<script>window.CARTA=[{"num": "I", "id": "gasa", "video": "gasa", "tit": "Gasa", "abv": "0 % – 5 % de alcohol", "cocteles": [{"nombre": "Ilusión", "texto": "En costura, la ilusión es un tul tan fino que en un vestido parece piel. Transparente como el tul.", "ing": "Vino fino · agua de tomate · lima · especias", "garnish": "Tomate cherry encurtido", "alg": "Alérgenos: apio, sulfitos"}, {"nombre": "Tul", "texto": "Tela fina y transparente de los velos y los tutús. Su nombre viene de Tulle, una ciudad de Francia. Ligero como un velo.", "ing": "Aperitivo floral sin alcohol · vermut blanco · lima · soda de pomelo rosa", "garnish": "Perfume floral", "alg": "Alérgenos: sulfitos"}, {"nombre": "Muselina", "texto": "Tela de algodón muy fina y ligera. Su nombre viene de Mosul, en Irak, y la más famosa se tejía a mano en Daca. Ligera como el aire.", "ing": "Destilado botánico sin alcohol · albahaca · lima · agave", "garnish": "Shiso", "alg": "Sin alérgenos declarados"}]}, {"num": "II", "id": "lino", "video": "lino", "tit": "Lino", "abv": "5 % – 12 % de alcohol", "cocteles": [{"nombre": "Golilla", "texto": "Cuello blanco y liso que Felipe IV impuso en Madrid en 1623 al prohibir los cuellos de lujo. Sobrio y recto como él.", "ing": "Manzanilla · vermut blanco · vermut seco · bitter de naranja", "garnish": "Piel de naranja", "alg": "Alérgenos: sulfitos"}, {"nombre": "Holanda", "texto": "Lino fino de las mejores camisas. Se llama así porque llegaba de Holanda, igual que la ginebra. Fresco como una camisa recién planchada.", "ing": "Ginebra · pimienta de Sichuan · lima · ginger beer", "garnish": "Jengibre y menta", "alg": "Sin alérgenos declarados"}, {"nombre": "Guayabera", "texto": "Camisa ligera de lino o algodón pensada para el calor. Cuba, México y Filipinas se disputan su origen. Fresca como ella.", "ing": "Vodka de vainilla · maracuyá · lima · almendra · espuma de cava", "garnish": "Corona de espuma de cava", "alg": "Alérgenos: huevo, frutos de cáscara, sulfitos"}]}, {"num": "III", "id": "lana", "video": "lana", "tit": "Lana", "abv": "12 % – 18 % de alcohol", "cocteles": [{"nombre": "Merino", "texto": "Oveja española de la lana más fina de Europa. Durante siglos, España prohibió sacarla del reino. Suave como su lana.", "ing": "Vodka de vainilla · amaretto · manzana · fresa · limón · bitter de chocolate", "garnish": "Fresa deshidratada", "alg": "Alérgenos: leche, frutos de cáscara"}, {"nombre": "Sarape", "texto": "Manta de lana mexicana de colores vivos. Las más famosas se tejían en Saltillo, en el norte de México. Cálido como un sarape.", "ing": "Mezcal · licor de chile ancho · jengibre · lima", "garnish": "Borde de Tajín y piel de lima", "alg": "Sin alérgenos declarados"}, {"nombre": "Tweed", "texto": "Paño de lana grueso y cálido de Escocia, con el nombre del río Tweed. Abriga como una chaqueta de tweed.", "ing": "Bourbon · licor de café · café ristretto · cacao · espuma de mascarpone", "garnish": "Cacao amargo y canela", "alg": "Alérgenos: leche, huevo"}]}, {"num": "IV", "id": "cuero", "video": "cuero", "tit": "Cuero", "abv": "Más de 18 % de alcohol", "cocteles": [{"nombre": "Napa", "texto": "Piel muy suave creada hacia 1875 en Napa, California, para hacer guantes. Suave como un guante.", "ing": "Tequila blanco · limón · crema de cassis · soda", "garnish": "Velo de cassis", "alg": "Sin alérgenos declarados"}, {"nombre": "Charol", "texto": "Cuero lacado y brillante. La palabra viene del nombre chino de la laca, a través del portugués. Pulido como un zapato de charol.", "ing": "Ron blanco · ron blanco overproof · marrasquino · lima · pomelo rosa", "garnish": "Cereza al marrasquino y piel de lima", "alg": "Sin alérgenos declarados"}, {"nombre": "Cordobán", "texto": "Cuero fino curtido en Córdoba, el más apreciado de la Europa medieval. Oscuro y profundo como el cuero.", "ing": "Ron añejo · sirope de tabaco · amontillado", "garnish": "Piel de naranja", "alg": "Alérgenos: sulfitos"}]}, {"num": "V", "id": "extra", "video": "terciopelo", "tit": "Terciopelo y brocado", "abv": "", "cocteles": [{"nombre": "Velours", "texto": "Terciopelo en francés, del latín villus, vello. Hubo leyes que decidían quién podía vestirlo. Redondo y suave como el terciopelo.", "ing": "Ron · baya rue · limón negro · panela · tonka", "garnish": "Cuchara con gastrique de panela y limón negro · manzana roja deshidratada", "alg": "Alérgenos: leche, sulfitos"}, {"nombre": "Brocart", "texto": "Brocado en francés, la seda tejida con hilo de oro de las cortes. Rico y ornamentado como el brocado.", "ing": "Vermut rosado · bitter italiano · ginebra · cacao blanco · avellana · amontillado · bitter de cacao", "garnish": "Cuchara con glaseado de Campari y naranja", "alg": "Alérgenos: frutos de cáscara, sulfitos"}]}];window.BUILD='1795393479';</script>
<script>
(function(){
var D=window.CARTA, H=document.documentElement;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var ps='';
D.forEach(function(p){
  var cs=p.cocteles.map(function(c){
    return '<div class="ck"><article class="card"><h3 class="rv">'+esc(c.nombre)+'</h3><p class="tx rv">'+esc(c.texto)+'</p>'+
    '<p class="sans ing rv">'+esc(c.ing)+'</p><div class="rv"><p class="gar"><i>Garnish:</i> '+esc(c.garnish)+'</p><p class="al">'+esc(c.alg)+'</p></div></article></div>';
  }).join('');
  ps+='<section class="pase" id="'+p.id+'" aria-labelledby="t-'+p.id+'"><div class="fondo"><div class="fill" style="background-image:url(video/'+p.video+'.jpg)"></div><video muted playsinline webkit-playsinline loop autoplay disablepictureinpicture disableremoteplayback preload="metadata" poster="video/'+p.video+'.jpg" data-src="video/'+p.video+'.mp4" aria-hidden="true"></video><div class="scrim"></div><div class="velo"></div></div>'+
      '<div class="capa"><div class="cab"><span class="sans pn">Pase '+p.num+'</span><h2 id="t-'+p.id+'">'+esc(p.tit)+'</h2>'+(p.abv?'<span class="sans ab">'+esc(p.abv)+'</span>':'')+'</div>'+cs+'</div></section>';
});
document.getElementById('pases').innerHTML=ps;

/* tarjetas: entran por partes */
var io1=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('ve');io1.unobserve(e.target)}})},{threshold:.2});
document.querySelectorAll('.card').forEach(function(c){io1.observe(c)});
/* vídeo: se carga y suena solo cuando su pase está en pantalla */
var io2=new IntersectionObserver(function(es){es.forEach(function(e){
  var v=e.target.querySelector('video'); if(!v) return;
  if(e.isIntersecting){ if(!v.getAttribute('src')){v.muted=true;v.src=v.dataset.src;} var pr=v.play(); if(pr&&pr.catch) pr.catch(function(){}); } else v.pause();
})},{rootMargin:'50% 0px'});
document.querySelectorAll('.pase').forEach(function(s){io2.observe(s)});
/* nítido mientras se ve el título del pase; difuminado mientras se leen los cócteles */
var io3=new IntersectionObserver(function(es){es.forEach(function(e){
  e.target.closest('.pase').classList.toggle('abierto', e.isIntersecting);
})},{threshold:.55});
document.querySelectorAll('.pase .cab').forEach(function(c){io3.observe(c)});

/* si el móvil guardó una versión vieja, la actualiza sola */
try{fetch('version.json?'+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
  if(String(j.v)!==window.BUILD){location.replace(location.pathname+'?v='+j.v);}}).catch(function(){});}catch(e){}
var hv=document.getElementById('hv'); var hp=hv.play(); if(hp&&hp.catch) hp.catch(function(){});
/* que los vídeos en pantalla no se queden nunca parados (p. ej. si el móvil bloquea el arranque hasta el primer toque) */
function enPantalla(v){var r=v.parentNode.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight;}
function sigue(){document.querySelectorAll('video').forEach(function(v){
  if(!v.getAttribute('src')&&v.dataset.src&&enPantalla(v)){v.muted=true;v.src=v.dataset.src;}
  if(v.getAttribute('src')&&v.paused&&enPantalla(v)){v.muted=true;var p=v.play();if(p&&p.catch)p.catch(function(){});}
});}
['touchstart','touchend','scroll','click','visibilitychange'].forEach(function(ev){window.addEventListener(ev,sigue,{passive:true});});
setInterval(sigue,1500);
var cvs=[];
document.querySelectorAll('video').forEach(function(v){
  var c=document.createElement('canvas'); c.className='cv'; c.setAttribute('aria-hidden','true'); v.parentNode.insertBefore(c,v.nextSibling); cvs.push([v,c]);
  v.controls=false; v.removeAttribute('controls');
});
function pinta(){
  cvs.forEach(function(q){var v=q[0],c=q[1]; if(v.readyState<2||!v.videoWidth||!enPantalla(v)) return;
    var d=Math.min(window.devicePixelRatio||1,2), W=Math.round(c.clientWidth*d), H=Math.round(c.clientHeight*d);
    if(c.width!==W||c.height!==H){c.width=W;c.height=H;}
    var r=Math.min(W/v.videoWidth,H/v.videoHeight), w=v.videoWidth*r, h=v.videoHeight*r;
    c.getContext('2d').drawImage(v,(W-w)/2,(H-h)/2,w,h);});
  requestAnimationFrame(pinta);}
requestAnimationFrame(pinta);
document.querySelectorAll('video').forEach(function(v){v.addEventListener('pause',function(){if(enPantalla(v)&&!document.hidden)setTimeout(sigue,200);});});

/* entrada: un hilo cose la pantalla, aparece el nombre y se abre el telón */
var pre=document.getElementById('pre');
if((window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)||/entrada=no|[?&]v=/.test(location.search)){pre.style.display='none';return;}
var wm=document.getElementById('prewm'); H.classList.add('bloq'); window.scrollTo(0,0);
'CONFUSO'.split('').forEach(function(c,i){var e=document.createElement('span');e.textContent=c;e.style.transitionDelay=(i*0.11)+'s';wm.appendChild(e)});
var path=pre.querySelector('.hilo'), L=path.getTotalLength(), mr=document.getElementById('mr'), ag=document.getElementById('aguja'), t0=null, dur=1700, fin=false;
function cose(ts){ if(!t0) t0=ts; var k=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-k,3), pt=path.getPointAtLength(L*e);
  mr.setAttribute('width',pt.x+2); ag.setAttribute('cx',pt.x); ag.setAttribute('cy',pt.y);
  if(k<1) requestAnimationFrame(cose); else ag.style.opacity=0; }
requestAnimationFrame(cose);
var a=setTimeout(function(){pre.classList.add('letras')},700);
var b=setTimeout(abre,3600);
function abre(){ if(fin) return; fin=true; clearTimeout(a); clearTimeout(b); pre.classList.add('letras','abre');
  setTimeout(function(){ pre.style.display='none'; H.classList.remove('bloq'); }, 1600); }
pre.addEventListener('click',abre);
})();
</script>
